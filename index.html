<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample App launch URLs</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">GitHub Pages demo</p>
      <h1>Sample App 출시용 URL 세트</h1>
      <p>이 데모는 인디 앱 출시 시 직접 준비해야 하는 공개 경로를 GitHub Pages에 올린 예시입니다. 스토어 콘솔과 광고 콘솔에는 아래 공개 URL을 복사해 넣습니다.</p>
      <div class="routes">
        <a class="route" href="/privacy/"><strong>개인정보처리방침</strong>/privacy/</a>
        <a class="route" href="/terms/"><strong>이용약관</strong>/terms/</a>
        <a class="route" href="/support/"><strong>고객지원</strong>/support/</a>
        <a class="route" href="/delete-account/"><strong>계정 삭제 안내</strong>/delete-account/</a>
        <a class="route" href="/app-ads.txt"><strong>app-ads.txt</strong>/app-ads.txt</a>
      </div>
    </main>
  </body>
</html>
